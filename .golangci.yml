run:
  timeout: 3m

linters:
  enable:
    - dupl
    - exhaustive
    - gocognit
    - gocritic
    - gofmt
    - goimports
    - misspell
    - revive
    - thelper
    - unconvert
    - whitespace
    - staticcheck

linters-settings:
  goimports:
    local-prefixes: github.com/ezphlow/go_template
  gocognit:
    min-complexity: 20
  revive:
    rules:
      - name: exported
        disabled: true
