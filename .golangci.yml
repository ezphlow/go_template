version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - dupl
    - exhaustive
    - gocognit
    - gocritic
    - misspell
    - revive
    - thelper
    - unconvert
    - whitespace
  settings:
    gocognit:
      min-complexity: 20
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ezphlow/go_template
